<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{margin:0;height:100vh;display:grid;place-items:center;background:#050505}
.box{width:55px;height:55px;border-radius:15px;background:linear-gradient(135deg,#75ffff,#a000ff);animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg) scale(.7)}}
</style></head><body><div class="box"></div></body></html>
